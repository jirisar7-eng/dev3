services:
  app:
    container_name: tatovacesta_app_dev3
    build: .
    ports:
      - "3003:3000"
    env_file:
      - .env
    environment:
      - PORT=3000
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL:-postgresql://tatovacesta:secure_password_dev3@postgres_dev3:5432/tatovacesta_dev3?schema=public}
      - JWT_SECRET=${JWT_SECRET:-dev3_super_secret_jwt_key}
    restart: always
    networks:
      - default
      - caddy_net
    depends_on:
      - postgres

  postgres:
    image: postgres:16-alpine
    container_name: postgres_dev3
    environment:
      POSTGRES_DB: tatovacesta_dev3
      POSTGRES_PASSWORD: secure_password_dev3
      POSTGRES_USER: tatovacesta
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_dev3:/var/lib/postgresql/data
    networks:
      - default

volumes:
  postgres_data_dev3:

networks:
  caddy_net:
    external: true
    name: tatovacesta_app_network

