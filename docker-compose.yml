services:
  app:
    container_name: tatovacesta_app_dev3
    build: .
    ports:
      - "3003:3000"
    env_file:
      - .env
    environment:
      - PORT=3000
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL:-postgresql://tatovacesta:secure_password_dev3@postgres_dev3:5432/tatovacesta_dev3?schema=public}
      - JWT_SECRET=${JWT_SECRET}
      - CLAMAV_HOST=${CLAMAV_HOST:-clamav_scanner}
      - CLAMAV_PORT=${CLAMAV_PORT:-3310}
      - MAILCOW_PUBLIC_URL=${MAILCOW_PUBLIC_URL:-https://mail.tatovacesta.cz}
      - MAILCOW_URL=${MAILCOW_URL:-https://mail.tatovacesta.cz}
      - MAILCOW_INTERNAL_URL=${MAILCOW_INTERNAL_URL:-https://172.22.1.14}
      - MAILCOW_INTERNAL_IP=${MAILCOW_INTERNAL_IP:-172.22.1.14}
      - MAILCOW_API_KEY=${MAILCOW_API_KEY:-}
    extra_hosts:
      - "mail.tatovacesta.cz:${MAILCOW_INTERNAL_IP:-172.22.1.14}"
    restart: always
    networks:
      - default
      - caddy_net
      - mailcow_network
    depends_on:
      - postgres
      - clamav

  postgres:
    image: postgres:16-alpine
    container_name: postgres_dev3
    environment:
      POSTGRES_DB: tatovacesta_dev3
      POSTGRES_PASSWORD: secure_password_dev3
      POSTGRES_USER: tatovacesta
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_dev3:/var/lib/postgresql/data
    networks:
      - default

  clamav:
    image: clamav/clamav:latest
    container_name: clamav_scanner
    restart: always
    ports:
      - "3310:3310"
    volumes:
      - clamav_data_dev3:/var/lib/clamav
    networks:
      - default

volumes:
  postgres_data_dev3:
  clamav_data_dev3:

networks:
  caddy_net:
    external: true
    name: tatovacesta_app_network
  mailcow_network:
    external: true
    name: mailcow-dockerized_mailcow-network

