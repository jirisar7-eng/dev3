services:
  app:
    container_name: tatovacesta_app
    build: .
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - PORT=3000
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL:-postgresql://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD}@postgres_prod3:5432/${POSTGRES_DB:-tatovacesta_prod3}?schema=public}
      - JWT_SECRET=${JWT_SECRET}
      - CLAMAV_HOST=${CLAMAV_HOST:-clamav_scanner}
      - CLAMAV_PORT=${CLAMAV_PORT:-3310}
      - MAILCOW_PUBLIC_URL=${MAILCOW_PUBLIC_URL:-https://mail.tatovacesta.cz}
      - MAILCOW_URL=${MAILCOW_URL:-https://mail.tatovacesta.cz}
      - MAILCOW_INTERNAL_URL=${MAILCOW_INTERNAL_URL:-https://172.22.1.14}
      - MAILCOW_INTERNAL_IP=${MAILCOW_INTERNAL_IP:-172.22.1.14}
      - MAILCOW_API_KEY=${MAILCOW_API_KEY:-}
    extra_hosts:
      - "mail.tatovacesta.cz:${MAILCOW_INTERNAL_IP:-172.22.1.14}"
    networks:
      - default
      - caddy_net
      - mailcow_network
    depends_on:
      - postgres
      - clamav

  postgres:
    image: postgres:16-alpine
    container_name: postgres_prod3
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tatovacesta_prod3}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER:-user}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_prod3:/var/lib/postgresql/data
    networks:
      - default

  clamav:
    image: clamav/clamav:latest
    container_name: clamav_scanner
    restart: always
    ports:
      - "3310:3310"
    volumes:
      - clamav_data_prod3:/var/lib/clamav
    networks:
      - default

volumes:
  postgres_data_prod3:
  clamav_data_prod3:

networks:
  caddy_net:
    external: true
    name: ${APP_NETWORK_NAME:-tatovacesta_app_network}
  mailcow_network:
    external: true
    name: mailcow-dockerized_mailcow-network


