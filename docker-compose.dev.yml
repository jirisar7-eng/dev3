version: '3.8'

services:
  app:
    container_name: tatovacesta_app_dev
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL:-postgresql://tatovacesta:secure_password_dev@postgres_db_dev:5432/tatovacesta_dev?schema=public}
      - JWT_SECRET=${JWT_SECRET:-dev_super_secret_jwt_key_tatovacesta}
    networks:
      - app_network
    depends_on:
      - postgres

  postgres:
    container_name: postgres_db_dev
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tatovacesta}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secure_password_dev}
      POSTGRES_DB: ${POSTGRES_DB:-tatovacesta_dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    networks:
      - app_network

networks:
  app_network:
    external: true

volumes:
  postgres_data_dev:
